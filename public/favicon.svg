<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="tinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#facc15" />
    </linearGradient>
    <linearGradient id="iceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Background circle badge -->
  <circle cx="50" cy="50" r="48" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2.5" />
  
  <!-- Central Star and HVAC dual element -->
  <g filter="url(#shadow)">
    <!-- Left metallic star facet -->
    <path d="M 50 12 L 50 50 L 22 68 L 33 37 Z" fill="url(#tinGrad)" stroke="#cbd5e1" stroke-width="0.5" />
    <path d="M 50 12 L 50 50 L 15 37 L 33 37 Z" fill="#64748b" opacity="0.9" />
    <path d="M 50 50 L 50 86 L 22 68 Z" fill="#334155" />
    
    <!-- Right Flame facet (Heating) -->
    <path d="M 50 12 C 55 24 64 26 72 20 C 70 30 78 35 85 37 L 50 50 Z" fill="url(#flameGrad)" />
    
    <!-- Lower Right Ice facet (Cooling) -->
    <path d="M 50 50 L 85 37 C 80 48 84 60 78 68 L 50 50 Z" fill="url(#iceGrad)" />
    <path d="M 50 50 L 78 68 C 72 75 64 82 50 86 Z" fill="#0284c7" />
    
    <!-- Center star core glimmer -->
    <polygon points="50,42 53,48 59,49 54,54 56,60 50,56 44,60 46,54 41,49 47,48" fill="#ffffff" opacity="0.95" />
  </g>
</svg>
